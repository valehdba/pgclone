services:
  # Source database (data to clone FROM)
  source-db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: source_db
    volumes:
      - ./test/fixtures/seed.sql:/docker-entrypoint-initdb.d/01-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Test on PostgreSQL 14
  test-pg14:
    build:
      context: .
      args:
        PG_VERSION: "14"
    environment:
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: target_db
      SOURCE_CONNINFO: "host=source-db dbname=source_db user=postgres password=testpass"
    depends_on:
      source-db:
        condition: service_healthy

  # Test on PostgreSQL 15
  test-pg15:
    build:
      context: .
      args:
        PG_VERSION: "15"
    environment:
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: target_db
      SOURCE_CONNINFO: "host=source-db dbname=source_db user=postgres password=testpass"
    depends_on:
      source-db:
        condition: service_healthy

  # Test on PostgreSQL 16
  test-pg16:
    build:
      context: .
      args:
        PG_VERSION: "16"
    environment:
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: target_db
      SOURCE_CONNINFO: "host=source-db dbname=source_db user=postgres password=testpass"
    depends_on:
      source-db:
        condition: service_healthy

  # Test on PostgreSQL 17
  test-pg17:
    build:
      context: .
      args:
        PG_VERSION: "17"
    environment:
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: target_db
      SOURCE_CONNINFO: "host=source-db dbname=source_db user=postgres password=testpass"
    depends_on:
      source-db:
        condition: service_healthy

  # Test on PostgreSQL 18
  test-pg18:
    build:
      context: .
      args:
        PG_VERSION: "18"
    environment:
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: target_db
      SOURCE_CONNINFO: "host=source-db dbname=source_db user=postgres password=testpass"
    depends_on:
      source-db:
        condition: service_healthy

  # ---- Oracle -> PostgreSQL tests (pgclone.table_from_oracle) ----
  # Oracle Free is published for x86-64 only; on Apple Silicon it runs under
  # emulation (slow first start — enable Rosetta in Docker Desktop).
  oracle-db:
    image: gvenzl/oracle-free:23-slim-faststart
    platform: linux/amd64
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: app
      APP_USER_PASSWORD: apppass
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  test-oracle-pg14:
    build:
      context: .
      dockerfile: Dockerfile.oracle
      args:
        PG_VERSION: "14"
    environment:
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: target_db
    depends_on:
      oracle-db:
        condition: service_healthy

  test-oracle-pg17:
    build:
      context: .
      dockerfile: Dockerfile.oracle
      args:
        PG_VERSION: "17"
    environment:
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: target_db
    depends_on:
      oracle-db:
        condition: service_healthy

  test-oracle-pg18:
    build:
      context: .
      dockerfile: Dockerfile.oracle
      args:
        PG_VERSION: "18"
    environment:
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: target_db
    depends_on:
      oracle-db:
        condition: service_healthy
